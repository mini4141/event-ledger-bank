# Local stack. Host ports avoid 8080/9090/16686 (often taken): envoy 18080/18081, jaeger 26686, prometheus 29090.
x-go: &go
  restart: unless-stopped
  environment: &goenv
    CASSANDRA_HOSTS: cassandra
    CASSANDRA_KEYSPACE: bank
    CASSANDRA_AUTH: none
    CASSANDRA_CONSISTENCY: LOCAL_QUORUM
    KAFKA_BROKERS: kafka:9092
    KAFKA_SASL: none
    ENVOY_GRPC_ADDR: envoy:8081
    OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    SINK_DIR: /data/sink
  depends_on:
    cassandra-init: { condition: service_completed_successfully }
    topic-init: { condition: service_completed_successfully }

services:
  cassandra:
    image: cassandra:5.0.4
    environment: { MAX_HEAP_SIZE: 512M, HEAP_NEWSIZE: 128M }
    ports: ["9042:9042"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
  cassandra-init:
    image: cassandra:5.0.4
    depends_on: { cassandra: { condition: service_healthy } }
    volumes: ["./db/cql/schema.cql:/schema.cql:ro"]
    entrypoint: ["cqlsh", "cassandra", "-f", "/schema.cql"]
  kafka:
    image: apache/kafka:4.0.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
  topic-init:
    build: { context: ., args: { SERVICE: topic-init } }
    image: elb/topic-init:dev
    environment: { KAFKA_BROKERS: "kafka:9092", KAFKA_SASL: none }
    depends_on: { kafka: { condition: service_healthy } }
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["26686:16686"]
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["29090:9090"]
  accounts:
    <<: *go
    build: { context: ., args: { SERVICE: accounts } }
    image: elb/accounts:dev
  ledger:
    <<: *go
    build: { context: ., args: { SERVICE: ledger } }
    image: elb/ledger:dev
  transfers:
    <<: *go
    build: { context: ., args: { SERVICE: transfers } }
    image: elb/transfers:dev
  notifications:
    <<: *go
    build: { context: ., args: { SERVICE: notifications } }
    image: elb/notifications:dev
  analytics-sink:
    <<: *go
    build: { context: ., args: { SERVICE: analytics-sink } }
    image: elb/analytics-sink:dev
    volumes: ["./.local/sink:/data/sink"]
    user: root
  web:
    build: ./web
    image: elb/web:dev
  envoy:
    build: ./envoy
    image: elb/envoy:dev
    ports: ["18080:8080", "18081:8081", "19901:9901"]
    depends_on: [accounts, ledger, transfers, notifications, web]
