syntax = "proto3";

package bank.v1;

import "google/api/annotations.proto";

option go_package = "github.com/mini4141/event-ledger-bank/gen/bank/v1;bankv1";

message Entry {
  string account_id = 1;
  string posted_at = 2;
  string posting_id = 3;
  string direction = 4;
  int64 amount_minor = 5;
  string counterparty = 6;
}

message PostRequest {
  string posting_id = 1;
  string from_account_id = 2;
  string to_account_id = 3;
  int64 amount_minor = 4;
}

message PostResponse {
  string posting_id = 1;
  int64 from_balance_minor = 2;
  int64 to_balance_minor = 3;
}

message ListEntriesRequest {
  string account_id = 1;
  int32 limit = 2;
}

message ListEntriesResponse {
  repeated Entry entries = 1;
}

service LedgerService {
  rpc Post(PostRequest) returns (PostResponse);
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse) {
    option (google.api.http) = {get: "/v1/accounts/{account_id}/entries"};
  }
}
