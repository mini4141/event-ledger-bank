syntax = "proto3";

package bank.v1;

import "google/api/annotations.proto";

option go_package = "github.com/mini4141/event-ledger-bank/gen/bank/v1;bankv1";

message Customer {
  string customer_id = 1;
  string name = 2;
  string created_at = 3;
}

message Account {
  string account_id = 1;
  string customer_id = 2;
  string currency = 3;
  int64 balance_minor = 4;
  int32 version = 5;
  string created_at = 6;
}

message CreateCustomerRequest {
  string name = 1;
}

message ListCustomersRequest {}

message ListCustomersResponse {
  repeated Customer customers = 1;
}

message OpenAccountRequest {
  string customer_id = 1;
  string currency = 2;
}

message GetAccountRequest {
  string account_id = 1;
}

message ListAccountsRequest {
  string customer_id = 1;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message DepositRequest {
  string account_id = 1;
  int64 amount_minor = 2;
  string idempotency_key = 3;
}

service AccountsService {
  rpc CreateCustomer(CreateCustomerRequest) returns (Customer) {
    option (google.api.http) = {
      post: "/v1/customers"
      body: "*"
    };
  }
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse) {
    option (google.api.http) = {get: "/v1/customers"};
  }
  rpc OpenAccount(OpenAccountRequest) returns (Account) {
    option (google.api.http) = {
      post: "/v1/accounts"
      body: "*"
    };
  }
  rpc GetAccount(GetAccountRequest) returns (Account) {
    option (google.api.http) = {get: "/v1/accounts/{account_id}"};
  }
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/v1/customers/{customer_id}/accounts"};
  }
  rpc Deposit(DepositRequest) returns (Account) {
    option (google.api.http) = {
      post: "/v1/deposits"
      body: "*"
    };
  }
}
