apiVersion: v1
kind: Service
metadata: { name: cassandra, namespace: bank }
spec:
  clusterIP: None
  selector: { app: cassandra }
  ports: [{ name: cql, port: 9042 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: cassandra, namespace: bank }
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels: { app: cassandra }
  template:
    metadata:
      labels: { app: cassandra }
    spec:
      containers:
        - name: cassandra
          image: cassandra:5.0.4
          env:
            - { name: MAX_HEAP_SIZE, value: 512M }
            - { name: HEAP_NEWSIZE, value: 128M }
          ports: [{ name: cql, containerPort: 9042 }]
          readinessProbe:
            exec: { command: ["bash", "-c", "cqlsh -e 'describe keyspaces'"] }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/cassandra }]
      volumes:
        - { name: data, emptyDir: {} } # ephemeral showcase data; no EBS CSI driver needed
---
apiVersion: batch/v1
kind: Job
metadata: { name: cassandra-schema, namespace: bank }
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cqlsh
          image: cassandra:5.0.4
          command: ["bash", "-c", "until cqlsh cassandra -f /schema/schema.cql; do echo waiting; sleep 5; done"]
          volumeMounts: [{ name: schema, mountPath: /schema }]
      volumes:
        - name: schema
          configMap: { name: cql-schema } # created by scripts/deploy.sh from db/cql/schema.cql
