apiVersion: v1
kind: Service
metadata: { name: cassandra, namespace: bank }
spec:
  clusterIP: None
  selector: { app: cassandra }
  ports: [{ name: cql, port: 9042 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: cassandra, namespace: bank }
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels: { app: cassandra }
  template:
    metadata:
      labels: { app: cassandra }
    spec:
      containers:
        - name: cassandra
          image: cassandra:5.0.4
          env:
            - { name: MAX_HEAP_SIZE, value: 512M }
            - { name: HEAP_NEWSIZE, value: 128M }
          ports: [{ name: cql, containerPort: 9042 }]
          readinessProbe:
            exec: { command: ["bash", "-c", "cqlsh -e 'describe keyspaces'"] }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/cassandra }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
