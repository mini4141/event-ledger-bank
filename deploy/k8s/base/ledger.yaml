apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  labels: { app: ledger }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ledger }
  template:
    metadata:
      labels: { app: ledger }
    spec:
      serviceAccountName: bank
      containers:
        - name: ledger
          image: elb/ledger:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: app-env }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
spec:
  clusterIP: None # headless: Envoy resolves pod IPs and load-balances/ejects per pod
  selector: { app: ledger }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: grpc, port: 9000, targetPort: grpc }
